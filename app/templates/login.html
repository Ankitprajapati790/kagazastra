<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - KagazAstra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="mx-auto max-w-lg px-4 py-12">
    <a class="text-xl font-extrabold text-blue-800" href="/">📄 KagazAstra</a>
    <section class="mt-6 rounded-2xl border bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold">Account sign in</h1>
      <p class="mt-1 text-sm text-slate-500">Client account ya administrator account se sign in karein.</p>
      <div class="mt-5 flex gap-2">
        <button id="showLogin" class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white">Sign in</button>
        <button id="showRegister" class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-semibold">Create client account</button>
      </div>
      <p id="authMessage" class="mt-4 hidden rounded-lg p-3 text-sm" role="status"></p>
      <form id="loginForm" class="mt-4 space-y-3">
        <label class="block text-sm font-medium">Email
          <input name="email" type="email" autocomplete="username" required maxlength="254" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <label class="block text-sm font-medium">Password
          <input name="password" type="password" autocomplete="current-password" required maxlength="256" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <button class="w-full rounded-lg bg-blue-700 px-4 py-2.5 font-bold text-white">Sign in</button>
      </form>
      <form id="registerForm" class="mt-4 hidden space-y-3">
        <label class="block text-sm font-medium">Full name
          <input name="full_name" autocomplete="name" required minlength="2" maxlength="100" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <label class="block text-sm font-medium">Email
          <input name="email" type="email" autocomplete="email" required maxlength="254" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <label class="block text-sm font-medium">Password <span class="font-normal text-slate-500">(at least 10 characters)</span>
          <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="256" class="mt-1 w-full rounded-lg border p-2.5">
        </label>
        <button class="w-full rounded-lg bg-emerald-700 px-4 py-2.5 font-bold text-white">Create client account</button>
      </form>
      <p class="mt-5 text-xs text-slate-500">First setup: administrator credentials are configured by the operator in the server `.env` file.</p>
    </section>
  </main>
  <script src="/static/panel.js"></script>
</body>
</html>
